spring.application.name=healthcare-management-system
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/healthcare_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.default-property-inclusion=non_null
app.jwt.secret=${JWT_SECRET:development-only-secret-key-change-before-deployment-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
springdoc.swagger-ui.path=/swagger-ui.html
